<!doctype html>
<html><head><meta charset="utf-8"><title>Vue test</title>
<style>
body { margin:0; background:#f8fafc; font-family: Arial, sans-serif; color:#0f172a; }
.app { padding:36px; }
h1 { font-size:32px; margin:0 0 10px; color:#7c3aed; }
p { font-size:16px; margin:0 0 16px; color:#334155; }
button { padding:8px 14px; background:#7c3aed; color:white; border:0; border-radius:8px; font-size:14px; }
.card { margin-top:18px; padding:14px 16px; background:white; border:1px solid #ede9fe; border-radius:10px; color:#5b21b6; }
</style></head><body>
<div id="app"></div>
<script src="vendor/vue.js"></script>
<script>
const { createApp, ref, onMounted } = Vue;
createApp({
  setup() {
    const n = ref(0);
    onMounted(function () {
      setTimeout(function () { n.value = 2; }, 120);
    });
    return { n: n };
  },
  template: '<div class="app"><h1>Vue 3 渲染成功</h1><p>ref 计数：{{ n }}</p><button @click="n++">点我加一</button><div class="card">template 编译、响应式更新与事件</div></div>'
}).mount('#app');
setTimeout(function () {
  const b = document.querySelector('button');
  if (b) { b.click(); console.log('clicked vue button'); }
}, 500);
</script>
</body></html>
