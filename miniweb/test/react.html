<!doctype html>
<html><head><meta charset="utf-8"><title>React test</title>
<style>
body { margin:0; background:#f8fafc; font-family: Arial, sans-serif; color:#0f172a; }
.app { padding:36px; }
h1 { font-size:32px; margin:0 0 10px; color:#0f766e; }
p { font-size:16px; margin:0 0 16px; color:#334155; }
button { padding:8px 14px; background:#0f766e; color:white; border:0; border-radius:8px; font-size:14px; }
.card { margin-top:18px; padding:14px 16px; background:white; border:1px solid #ccfbf1; border-radius:10px; color:#115e59; }
</style></head><body>
<div id="root"></div>
<script src="vendor/react.js"></script>
<script src="vendor/react-dom.js"></script>
<script>
const e = React.createElement;
function App() {
  const [n, setN] = React.useState(0);
  React.useEffect(function () {
    const t = setTimeout(function () { setN(2); }, 120);
    return function () { clearTimeout(t); };
  }, []);
  return e('div', { className: 'app' },
    e('h1', null, 'React 18 渲染成功'),
    e('p', null, 'useState 计数：' + n),
    e('button', { onClick: function () { setN(function (v) { return v + 1; }); } }, '点我加一'),
    e('div', { className: 'card' }, '这段 DOM 由 React 在 MiniWeb 内创建')
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(e(App));
setTimeout(function () {
  const b = document.querySelector('button');
  if (b) { b.click(); console.log('clicked react button'); }
}, 500);
</script>
</body></html>
