<!doctype html><style>html,body{margin:0}body{height:2200px}#panel{margin-top:100px;width:200px;height:100px;overflow:auto}#target{position:absolute;left:20px;top:800px;width:100px;height:20px;padding:0;border:0}button{position:fixed;top:0;width:80px;height:24px}#start{left:300px}#nearest{left:400px}#focus{left:500px}</style><div id="panel"><div style="height:600px"></div><input id="target"></div><button id="start">Start</button><button id="nearest">Nearest</button><button id="focus">Focus</button><script>var p=document.getElementById("panel"),t=document.getElementById("target");["start","nearest","focus"].forEach(function(id){document.getElementById(id).onclick=function(){scrollTo(0,0);p.scrollTop=0;if(id==="focus")t.focus();else t.scrollIntoView(id==="nearest"?{container:"nearest"}:undefined);document.body.setAttribute("data-measure",JSON.stringify([p.scrollTop,scrollY,t.getBoundingClientRect().y]))}})</script>
