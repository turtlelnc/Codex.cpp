<!doctype html><style>
*{box-sizing:border-box}html,body{margin:0;padding:0}body{height:1800px}
#fixed{position:fixed;left:300px;top:10px;width:100px;height:30px;background:#ff0000;z-index:20}
#panel{position:absolute;left:20px;top:60px;width:220px;height:180px;overflow:auto}
#content{width:400px;height:700px;background:#ffffff}
#sticky{position:sticky;top:0;width:200px;height:30px;background:#008000;z-index:2}
#target{display:block;position:relative;top:250px;left:120px;width:80px;height:30px;background:#0000ff}
#clip{position:absolute;left:300px;top:100px;width:100px;height:60px;overflow:clip}
#clip-content{width:300px;height:300px}
#hidden{position:absolute;left:420px;top:100px;width:100px;height:60px;overflow:hidden}
#hidden-content{width:300px;height:300px}
</style><div id="fixed">Fixed</div><div id="panel"><div id="content"><div id="sticky">Sticky</div><button id="target">Target</button></div></div><div id="clip"><div id="clip-content"></div></div><div id="hidden"><div id="hidden-content"></div></div>
<script>
var panel=document.getElementById('panel'),fixed=document.getElementById('fixed'),target=document.getElementById('target');
fixed.addEventListener('wheel',function(e){e.preventDefault();document.body.setAttribute('data-wheel','canceled')});
target.onclick=function(){document.body.setAttribute('data-click','target')};fixed.onclick=function(){document.body.setAttribute('data-click','fixed')};
panel.addEventListener('scroll',function(){document.body.setAttribute('data-scroll',panel.scrollLeft+':'+panel.scrollTop)});
document.addEventListener('scroll',function(){document.body.setAttribute('data-window-scroll',String(scrollY))});
</script>
