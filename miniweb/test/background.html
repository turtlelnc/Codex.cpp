<!doctype html><meta charset="utf-8"><style>body{margin:0}input{display:block;height:24px}</style><input id="field" value="seed"><script>
var field=document.getElementById('field');field.addEventListener('change',function(){document.body.setAttribute('data-kept',field.value);document.body.style.background=field.value==='kept'?'green':'red'});
document.addEventListener('mousedown',function(e){if(e.clientX===500&&e.clientY===400)e.preventDefault()});
</script>
