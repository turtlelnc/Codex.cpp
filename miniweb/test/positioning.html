<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;font:16px/20px monospace}button{font:inherit}
.frame{position:relative;width:400px;height:240px;padding:20px;border:4px solid black;margin:20px}
#static{margin:10px 0 0 30px;padding:10px;border:2px solid #888;width:240px;height:100px;overflow:hidden}
#inner{padding:12px}
#pin{position:absolute;left:10%;top:25%;width:40px;height:30px;background:#ff0000;z-index:10}
#nested{position:absolute;left:200px;top:40px;width:100px;height:80px;border:3px solid black;padding:5px}
#nested-static{padding:7px}#corner{position:absolute;right:0;bottom:0;width:20px;height:10px;background:#0000ff}
#inline-pin{position:absolute;left:300px;top:20px;width:20px;height:20px;background:#0000ff}
#opacity{opacity:.5;width:100px;height:20px}#alpha{position:absolute;left:160px;top:20px;width:10px;height:10px;background:#00ff00}
#fill-frame,#center-frame{width:200px;height:120px;padding:10px;border:2px solid black}
#fill{position:absolute;left:10px;right:20px;top:15px;bottom:25px;margin:3px;padding:5px;border:2px solid black;background:#008866}
#center{position:absolute;left:0;right:0;top:0;bottom:0;width:60px;height:20px;margin:auto;background:#008866}
#translated,#zero{position:static;transform:translate(15px,10px);width:200px;height:100px;padding:10px;border:2px solid black;margin:20px}
#zero{transform:translate(0px)}.transform-pin{position:absolute;right:0;top:0;width:20px;height:10px;background:#008866}
#loose{margin:40px;width:20px;height:20px}#viewport{position:absolute;right:8px;top:5px;width:30px;height:20px;background:#0000ff}
#toggle{position:fixed;left:5px;top:5px;z-index:100}
</style></head><body data-clicks="0" data-bubbled="no">
<button id="toggle">Toggle transform</button>
<div class="frame" id="cb"><div id="static"><div id="inner"><div id="pin"></div></div></div>
<div id="nested"><div id="nested-static"><div id="corner"></div></div></div>
<span><span id="inline-pin"></span></span><div id="opacity"><div id="alpha"></div></div></div>
<div class="frame" id="fill-frame"><div><div id="fill"></div></div></div>
<div class="frame" id="center-frame"><div id="center"></div></div>
<div id="translated"><div><div class="transform-pin" id="translated-pin"></div></div></div>
<div id="zero"><div><div class="transform-pin" id="zero-pin"></div></div></div>
<div id="loose"><div id="viewport"></div></div>
<script>
document.getElementById('pin').addEventListener('click',function(){document.body.setAttribute('data-clicks',String(Number(document.body.getAttribute('data-clicks'))+1));});
document.getElementById('static').addEventListener('click',function(){document.body.setAttribute('data-bubbled','yes');});
document.getElementById('toggle').addEventListener('click',function(){var n=document.getElementById('zero');n.style.transform=n.style.transform==='none'?'translate(0px)':'none';});
</script></body></html>
