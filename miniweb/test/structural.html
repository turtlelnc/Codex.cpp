<!doctype html><html><head><style>
html,body{margin:0;padding:0;width:640px;height:480px}body{position:relative}
#center{position:absolute;left:50%;top:50%;width:100px;height:60px;transform:translate(-50%,-50%);background:#ff0000}
#front,#back{position:absolute;left:20px;top:20px;width:80px;height:80px}#front{z-index:10;background:#ff0000}#back{z-index:1;background:#0000ff}
#grid{position:absolute;left:0;top:330px;display:grid;width:600px;grid-template-columns:repeat(3,1fr);gap:10px}#grid>div{height:40px}#wide{grid-column:span 2;background:#ff0000}#next{background:#0000ff}#wrap{background:#008000}
#min,#max,#clamp{position:absolute;left:430px;height:20px;background:#008000}#min{top:20px;width:min(60%,180px)}#max{top:60px;width:max(25%,100px)}#clamp{top:100px;width:clamp(100px,50%,200px)}
</style><style media="print">#front{background:green}</style><style media="screen and (min-width: 1000px)">#front{background:green}</style><link rel="stylesheet" media="print" href="missing-print-only.css"></head><body><div id="min"></div><div id="max"></div><div id="clamp"></div><div id="center"></div><div id="front"></div><div id="back"></div><div id="grid"><div id="wide"></div><div id="next"></div><div id="wrap"></div></div><script>document.getElementById('front').addEventListener('click',function(){this.style.background='#008000'});document.getElementById('center').addEventListener('click',function(){this.style.background='#008000'});</script></body></html>
