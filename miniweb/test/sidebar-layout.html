<!doctype html>
<meta charset="utf-8">
<style>
body { margin: 0; }
#viewport { height: 20dvh; }
#grid { display: grid; grid-template-columns: 120px 1fr; height: 300px; }
#sidebar { display: flex; flex-direction: column; min-height: 0; }
#header { height: 40px; }
#list { flex: 1; min-height: 0; overflow: auto; }
#list-content { height: 600px; }
#footer { display: flex; flex: none; height: 30px; }
#label, #settings { width: 20px; }
#settings { margin-left: auto; }
#auto-row { display: flex; width: 120px; height: 30px; justify-content: center; }
#auto-item { width: 20px; margin: 0 auto; }
#fixed-grid { display: grid; grid-template-rows: 30px auto; height: 100px; }
#fixed-row, #auto-track { min-height: 0; }
#fractional-grid { display: grid; grid-template-rows: 1fr; height: 100px; }
#fractional-scroll { min-height: 0; overflow: auto; }
#fractional-content { height: 100px; }
</style>
<div id="viewport"></div>
<div id="grid">
  <aside id="sidebar">
    <header id="header"></header>
    <div id="list"><div id="list-content"></div></div>
    <footer id="footer"><span id="label"></span><span id="settings"></span></footer>
  </aside>
  <main></main>
</div>
<div id="auto-row"><div id="auto-item"></div></div>
<div id="fixed-grid"><div id="fixed-row"></div><div id="auto-track"></div></div>
<div id="fractional-grid"><div id="fractional-scroll"><div id="fractional-content"></div></div></div>
<style>
.column { display: flex; flex-direction: column; height: 300px; }
.competing { flex: 1; }
.tall { height: 200px; }
.short { height: 100px; }
#scroll-flex { overflow: auto; }
#zero-flex { min-height: 0; }
#capped-flex { max-height: 120px; }
</style>
<div class="column">
  <div id="content-minimum" class="competing"><div class="tall"></div></div>
  <div id="content-remainder" class="competing"><div class="short"></div></div>
</div>
<div class="column">
  <div id="scroll-flex" class="competing"><div class="tall"></div></div>
  <div id="zero-flex" class="competing"><div class="tall"></div></div>
</div>
<div class="column">
  <div id="capped-flex" class="competing"><div class="tall"></div></div>
  <div id="capped-remainder" class="competing"><div class="short"></div></div>
</div>
