<!doctype html><html><head><meta charset="utf-8"><title>Click test</title>
<style>
body { margin:0; font-family:Arial,sans-serif; background:#f8fafc; color:#0f172a; }
.box { padding:30px; }
h1 { font-size:30px; margin:0 0 14px; color:#0f766e; }
button { display:inline-block; padding:10px 18px; background:#0f766e; color:white; border:0; border-radius:8px; font-size:16px; }
p { font-size:16px; color:#334155; }
</style></head><body><div class="box">
<h1>原生点击测试</h1>
<button id="b">点击次数：0</button>
<p id="out">等待点击</p>
<script>
var n = 0;
document.getElementById('b').onclick = function () {
  n++;
  document.getElementById('b').textContent = '点击次数：' + n;
  document.getElementById('out').textContent = '已收到 ' + n + ' 次点击';
};
</script>
</div></body></html>
