<!doctype html><html><head><link rel="stylesheet" href="style-assets/main.css"><style>
html,body{margin:0;width:640px;height:480px}body{position:relative}
#cascade,#dynamic,#asset,#custom,#inline-asset,#inserted{position:absolute;top:0;width:50px;height:50px}
#cascade{left:0;background:#0000ff}#dynamic{left:60px}#asset{left:120px}#custom{left:180px}#inline-asset{left:240px;background-image:url(root-tile.svg)}

#clip{position:absolute;left:0;top:120px;width:50px;height:20px;overflow:hidden}#hidden-child{height:100px;background:#ff0000}#clip-marker{position:absolute;left:60px;top:120px;width:50px;height:20px;background:#ff0000}#script-marker{position:absolute;left:360px;top:0;width:50px;height:50px;background:#ff0000}
</style><style id="dynamic-css">#dynamic{background:#ff0000}</style></head><body>
<div id="cascade"></div><div id="dynamic"></div><div id="asset"></div><div id="custom"></div><div id="inline-asset"></div><div id="inserted"></div>
<div id="clip"><div id="hidden-child"></div></div><div id="clip-marker"></div><div id="script-marker"></div>
<script>document.getElementById('dynamic-css').textContent='#dynamic{background:#0000ff}';document.getElementById('dynamic').addEventListener('click',function(){document.getElementById('dynamic-css').textContent='#dynamic{background:#008000}'});var extra=document.createElement("style");extra.textContent="#inserted{background:#0000ff}";document.head.appendChild(extra);document.getElementById("inserted").addEventListener("click",function(){extra.textContent="#inserted{background:#008000}"});document.getElementById('hidden-child').addEventListener('click',function(){document.getElementById('clip-marker').style.background='#008000'});var scriptHost=document.createElement('div');document.body.appendChild(scriptHost);scriptHost.innerHTML=Array(21).join('<scr'+'ipt>document.getElementById("script-marker").style.background="#ff0000";</scr'+'ipt>');</script><script>document.getElementById('script-marker').style.background='#0000ff';</script></body></html>
