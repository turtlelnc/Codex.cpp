<!doctype html>
<html><head><meta charset="utf-8"><title>MiniWeb</title>
<style>
body { margin: 0; background: #f6f7fb; color:#1f2937; font-family: Arial, sans-serif; }
.hero { background:#0f172a; color:#f8fafc; padding:36px 42px; }
.hero h1 { margin:0 0 10px; font-size:40px; font-weight:bold; }
.hero p { margin:0; font-size:16px; color:#cbd5e1; }
.wrap { padding: 28px 42px; }
.row { display:flex; gap:18px; margin-bottom:24px; }
.card { flex:1; background:white; border:1px solid #e2e8f0; border-radius:12px; padding:18px; }
.card h2 { margin:0 0 8px; font-size:20px; }
.card p { margin:0; font-size:14px; line-height:1.6; color:#475569; }
.thumb { width:100%; height:150px; object-fit:cover; border-radius:8px; margin-bottom:12px; }
.badge { display:inline-block; background:#dbeafe; color:#1d4ed8; padding:4px 9px; border-radius:999px; font-size:12px; }
.cols { display:flex; gap:20px; align-items:center; }
.big { font-size:28px; font-weight:bold; }
.mono { font-family: monospace; background:#eef2ff; padding:8px 10px; border-radius:6px; }
a { color:#2563eb; }
</style></head>
<body>
<div class="hero"><h1>MiniWeb 本地浏览器</h1><p>离线渲染 · 本地文件 · 127.0.0.1 回环资源 · 自研排版</p></div>
<div class="wrap">
  <div class="row">
    <div class="card"><div class="badge">Flex</div><h2>卡片一</h2><p>中文、英文、字号、行高、边框和圆角都在自研引擎中完成。</p></div>
    <div class="card"><div class="badge">CSS</div><h2>卡片二</h2><p>支持 flex、gap、百分比宽度和内联样式，适合本地 WebUI。</p></div>
    <div class="card"><div class="badge">Image</div><h2>卡片三</h2><img class="thumb" src="assets/gradient.png"><p>本地 PNG 图片。</p></div>
  </div>
  <div class="cols">
    <div class="big">1280 × 800</div>
    <div class="mono">font-family: monospace</div>
    <a href="other.html">另一个本地页面</a>
  </div>
</div>
</body></html>
