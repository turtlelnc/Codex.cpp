<!doctype html><html><head><style>
html,body{margin:0;font:14px/20px "DejaVu Sans Mono",monospace;background:white;color:#111}
table{border:1px solid #000;border-spacing:0;margin:4px}
td,th{padding:2px;border:1px solid #444}
#ok{color:#123;padding:4px}
#ignored{filter:blur(2px);text-shadow:0 0 2px #000;-webkit-line-clamp:2}
#contents{display:contents}
#sticky{position:sticky;top:0}
#transformed{transform:rotate(15deg)}
#risky{border-collapse:collapse}
</style></head><body>
<div id="ok">supported</div>
<div id="ignored">ignored</div>
<div id="contents">contents</div>
<div id="sticky">sticky</div>
<div id="transformed">rotated</div>
<div id="inlineTable" style="display:inline-table">inline table</div>
<div id="badDisplay" style="display:ruby">ruby</div>
<table id="risky"><caption id="cap">Caption</caption><colgroup><col><col></colgroup>
<thead><tr><th id="head-cell">H</th></tr></thead>
<tbody><tr><td id="spanning" rowspan="2">span</td><td id="wide" colspan="2">wide</td></tr><tr><td id="rest1">c</td><td id="rest2">d</td></tr></tbody></table>
<table id="pct"><tr><td id="pct-cell" style="width:50%">half</td><td id="pct-rest">rest</td></tr></table>
<table id="outer"><tr><td id="outer-cell"><table id="nested"><tr><td id="nested-cell">nested</td></tr></table></td></tr></table>
<table id="plain"><tr><td id="plain1">plain</td><td id="plain2">table</td></tr></table>
<script>
document.getElementById('spanning').attachShadow({mode:'open'});
document.getElementById('spanning').scrollIntoView();
window.scrollTo(0,10);
new IntersectionObserver(function(){}).observe(document.body);
new ResizeObserver(function(){}).observe(document.body);
</script>
<script>undefinedGlobalApi();</script>
<script>document.getElementById('plain1').missingMethod();</script>
</body></html>
