<!doctype html><html><head><style>
html,body{margin:0;background:white}

#medium{left:10px;top:80px;border:solid green}
#reset-style{left:70px;top:80px;border:5px solid green;border:red}
#current{left:130px;top:80px;border:3px solid;color:red}
