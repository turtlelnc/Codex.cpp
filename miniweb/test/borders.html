<!doctype html><html><head><style>
html,body{margin:0;background:white}
div,button{position:absolute;top:10px;width:40px;height:30px;background:white;padding:0;box-sizing:content-box}
#zero{left:10px;border:6px solid red;border:0}
#none{left:70px;border:6px solid red;border:none}
#zero-solid{left:130px;border:0 solid red}
#width-first{left:190px;border-width:4px;border-style:solid;border-color:green}
#style-first{left:260px;border-style:solid;border-width:4px;border-color:green}
#transparent{left:330px;border:4px solid transparent}
#width-only{left:400px;border-left-width:8px}
#hidden-width{left:460px;border:5px solid green;border-style:none;border-style:solid}
#side-zero{left:530px;border:5px solid green;border-left-width:0;border-left-style:solid}
#medium{left:10px;top:80px;border:solid green}
#reset-style{left:70px;top:80px;border:5px solid green;border:red}
#current{left:130px;top:80px;border:3px solid;color:red}
#invalid{left:200px;top:80px;border:5px solid green;border:banana}
#negative{left:260px;top:80px;border:5px solid green;border-left-width:-1px}
</style></head><body>
<button id="zero"></button><div id="none"></div><div id="zero-solid"></div>
<div id="width-first"></div><div id="style-first"></div><div id="transparent"></div>
<div id="width-only"></div><div id="hidden-width"></div><div id="side-zero"></div>
<div id="medium"></div><div id="reset-style"></div><div id="current"></div>
<div id="invalid"></div><div id="negative"></div></body></html>
