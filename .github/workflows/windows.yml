name: Windows build and runtime
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build runtime and native checks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          $sources = @{
            'codex.cpp' = 'codex-cpp'
            'codex_self_test.cpp' = 'self-test'
            'tests/plugins.cpp' = 'plugins-test'
            'tests/windows_runtime.cpp' = 'windows-runtime-test'
          }
          foreach ($source in $sources.Keys) {
            cl /nologo /std:c++17 /EHsc /utf-8 /W4 /O1 /DWINVER=0x0A00 /D_WIN32_WINNT=0x0A00 /DNTDDI_VERSION=0x0A000006 /Fo"build\$($sources[$source]).obj" /Fe"build\$($sources[$source]).exe" $source
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Review direct imports against compatibility baseline
        shell: pwsh
        run: |
          python tests/windows_imports.py build/codex-cpp.exe build/self-test.exe build/plugins-test.exe build/windows-runtime-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native runtime, plugins and console input
        shell: pwsh
        run: |
          & .\build\codex-cpp.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $failed = $false
          foreach ($test in @('self-test', 'plugins-test', 'windows-runtime-test')) {
            & ".\build\$test.exe"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-${{ matrix.os }}
          path: build/*.exe
