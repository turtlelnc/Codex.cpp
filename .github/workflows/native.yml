name: Native web runtime
on: [push, pull_request, workflow_dispatch]
jobs:
  miniweb-sanitizer:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated renderer with AddressSanitizer
        run: >-
          cmake -S miniweb -B build-miniweb-asan -DCMAKE_BUILD_TYPE=Debug
          "-DCMAKE_C_FLAGS=-fsanitize=address -fno-omit-frame-pointer"
          "-DCMAKE_CXX_FLAGS=-fsanitize=address -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address
      - run: cmake --build build-miniweb-asan --target miniweb-regression --parallel 2
      - run: ./build-miniweb-asan/miniweb-regression miniweb/test/structural.html
  embedded-git:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cmake -S . -B build-libgit2 -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-libgit2 --parallel 4
      - run: node tests/libgit2_trial.cjs build-libgit2/codex-cpp
      - run: node tests/native_smoke.cjs build-libgit2/codex-cpp
      - run: node tests/standalone_test.cjs build-libgit2/codex-cpp
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap curl git
      - run: node tests/native_web_test.cjs build-libgit2/codex-cpp
        env:
          CODEX_TEST_NO_GIT: 1
      - run: node tests/agent_git_test.cjs build-libgit2/codex-cpp
      - run: node tests/team_service_test.cjs build-libgit2/codex-cpp
      - run: node tests/tui_team_test.cjs build-libgit2/codex-cpp
      - run: node tests/team_remote_tui_test.cjs build-libgit2/codex-cpp
      - run: node tests/direct_team_test.cjs build-libgit2/codex-cpp
      - run: node tests/review_regressions.cjs build-libgit2/codex-cpp
  build-and-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - shell: bash
        run: cmake --build build --config Release --parallel 2 2>&1 | tee native-build.log
      - name: Build Plugin module and registry regression
        run: cmake --build build --config Release --target plugin-runtime-test plugin-demo --parallel 2
      - if: runner.os != 'Windows'
        run: ./build/plugin-runtime-test
      - if: runner.os == 'Windows'
        run: ./build/Release/plugin-runtime-test.exe
      - if: runner.os != 'Windows'
        run: node tests/plugin_integration.cjs build/codex-cpp build/plugin-demo/plugin.json
      - if: runner.os == 'Windows'
        run: node tests/plugin_integration.cjs build/Release/codex-cpp.exe build/plugin-demo/Release/plugin.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Verify portable profile and executable update lifecycle
        shell: bash
        run: |
          binary=build/codex-cpp
          if [ "$RUNNER_OS" = Windows ]; then binary=build/Release/codex-cpp.exe; fi
          node tests/long_session_test.cjs "$binary"
          node tests/context_budget_test.cjs "$binary"
          node tests/compaction_history_test.cjs "$binary"
          node tests/agent_failure_test.cjs "$binary"
          node tests/reasoning_continuation_test.cjs "$binary"
          node tests/provider_budget_restart_test.cjs "$binary"
          node tests/portable_data_test.cjs "$binary"
          node tests/portable_update_test.cjs "$binary"
      - name: Build Creator lifecycle regression harness
        run: cmake --build build --config Release --target codex-self-test miniweb-regression --parallel 2
      - name: Build explicit team compatibility modules
        run: cmake --build build --config Release --target team-protocol-compat team-protocol-fixture team-protocol-bad-fixture --parallel 2
      - name: Verify team protocol negotiation and native adapter behavior
        shell: bash
        run: |
          base=build
          module_config=
          if [ "$RUNNER_OS" = Windows ]; then base=build/Release; module_config=/Release; fi
          binary="$base/codex-cpp"
          probe="$base/codex-self-test"
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; probe="$probe.exe"; fi
          node tests/team_protocol_test.cjs "$binary" "$probe" "build/team-protocol-compat$module_config/plugin.json" "build/team-protocol-fixture$module_config/plugin.json" "build/team-protocol-bad-fixture$module_config/plugin.json"
      - name: Verify embedded MiniWeb preview and sandbox boundaries
        shell: bash
        run: |
          binary=build/codex-cpp
          probe=build/miniweb/miniweb-regression
          if [ "$RUNNER_OS" = Windows ]; then binary=build/Release/codex-cpp.exe; probe=build/miniweb/Release/miniweb-regression.exe; fi
          "$probe" miniweb/test/structural.html
          node tests/miniweb_test.cjs "$binary"
      - name: Verify concurrent read-only side conversations
        shell: bash
        run: |
          binary=build/codex-cpp
          probe=build/codex-self-test
          if [ "$RUNNER_OS" = Windows ]; then binary=build/Release/codex-cpp.exe; probe=build/Release/codex-self-test.exe; fi
          "$probe" --side-boundary-checks "$RUNNER_TEMP/side-boundary"
          node tests/side_chat_test.cjs "$binary"
      - name: Verify observable model progress, retry and streaming safety
        shell: bash
        run: |
          binary=build/codex-cpp
          probe=build/codex-self-test
          if [ "$RUNNER_OS" = Windows ]; then binary=build/Release/codex-cpp.exe; probe=build/Release/codex-self-test.exe; fi
          node tests/model_activity_test.cjs "$binary" "$probe"
      - name: Verify shared settings and reasoning request serialization
        shell: bash
        run: |
          binary=build/codex-cpp
          if [ "$RUNNER_OS" = Windows ]; then binary=build/Release/codex-cpp.exe; fi
          node tests/settings_test.cjs "$binary"
      - name: Verify bounded atomic journal replacement under reader locks
        shell: bash
        run: |
          binary=build/codex-self-test
          if [ "$RUNNER_OS" = Windows ]; then binary=build/Release/codex-self-test.exe; fi
          "$binary" --journal-replacement-checks "$RUNNER_TEMP/journal-replacement"
      - name: Verify login snapshot privacy and provider budget retention
        shell: bash
        run: |
          binary=build/codex-self-test
          if [ "$RUNNER_OS" = Windows ]; then binary=build/Release/codex-self-test.exe; fi
          "$binary" --web-boundary-checks "$RUNNER_TEMP/web-boundary-regressions"
      - name: Verify updater HTTPS, cancellation and partial cleanup
        shell: bash
        run: |
          binary=build/codex-self-test
          if [ "$RUNNER_OS" = Windows ]; then binary=build/Release/codex-self-test.exe; fi
          node tests/portable_download_test.cjs "$binary"
      - if: runner.os != 'Windows'
        run: ./build/codex-self-test --creator-process-checks "${{ runner.temp }}/creator-lifecycle"
      - if: runner.os == 'Windows'
        run: ./build/Release/codex-self-test.exe --creator-process-checks "${{ runner.temp }}/creator-lifecycle"
      - if: runner.os != 'Windows'
        run: node tests/plugin_naming_test.cjs build/codex-cpp
      - if: runner.os == 'Windows'
        run: node tests/plugin_naming_test.cjs build/Release/codex-cpp.exe
      - if: runner.os != 'Windows'
        run: node tests/plugin_creator_test.cjs build/codex-cpp
      - if: runner.os == 'Windows'
        run: node tests/plugin_creator_test.cjs build/Release/codex-cpp.exe
      - if: runner.os != 'Windows'
        run: node tests/native_smoke.cjs build/codex-cpp
      - if: runner.os != 'Windows'
        run: node tests/chat_stream_test.cjs build/codex-cpp
      - if: runner.os == 'Windows'
        run: node tests/native_smoke.cjs build/Release/codex-cpp.exe
      - if: runner.os != 'Windows'
        run: node tests/webui_design_test.cjs build/codex-cpp
      - if: runner.os == 'Windows'
        run: node tests/webui_design_test.cjs build/Release/codex-cpp.exe
      - if: runner.os == 'Windows'
        run: node tests/chat_stream_test.cjs build/Release/codex-cpp.exe
      - if: runner.os != 'Windows'
        run: node tests/direct_team_test.cjs build/codex-cpp
      - if: runner.os == 'Windows'
        run: node tests/direct_team_test.cjs build/Release/codex-cpp.exe
      - if: runner.os != 'Windows'
        run: node tests/libgit2_trial.cjs build/codex-cpp
      - if: runner.os == 'Windows'
        run: node tests/libgit2_trial.cjs build/Release/codex-cpp.exe
      - name: Publish build diagnostics
        if: failure()
        shell: bash
        run: |
          if [ -f native-build.log ]; then
            printf '### Build diagnostics\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 native-build.log >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
            node -e 'for (const line of require("fs").readFileSync("native-build.log", "utf8").split(/\r?\n/).filter(s => /error:|fatal error|error C[0-9]+/.test(s)).slice(0, 20)) console.log("::error::" + line.replaceAll("%", "%25"));'
          fi
  core-self-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap curl git
      - run: cmake -S . -B build-core -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-core --target codex-self-test codex-transport-test --parallel 2
      - run: node tests/http_transport_test.cjs build-core/codex-transport-test
      - shell: bash
        run: |
          ./build-core/codex-self-test 2>&1 | tee native-self-test.log
      - name: Publish test diagnostics
        if: failure()
        shell: bash
        run: |
          for log in native-self-test.log native-integration.log; do
            if [ -f "$log" ]; then
              printf '### %s\n\n```text\n' "$log" >> "$GITHUB_STEP_SUMMARY"
              tail -n 120 "$log" >> "$GITHUB_STEP_SUMMARY"
              printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
              node -e 'for (const line of require("fs").readFileSync(process.argv[1], "utf8").split(/\r?\n/).filter(s => /^FAIL\b|Error:|AssertionError/.test(s)).slice(0, 20)) console.log("::error::" + line.replaceAll("%", "%25"));' "$log"
            fi
          done
  webui-browser-regressions:
    timeout-minutes: 5
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/webui-tests" playwright@1.62.1
          "$RUNNER_TEMP/webui-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run WebUI race, layout and rendering regressions
        run: NODE_PATH="$RUNNER_TEMP/webui-tests/node_modules" node tests/webui_quality_test.cjs
  plugin-browser:
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build native host and example module
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target codex-cpp plugin-demo codex-self-test miniweb-regression --parallel 2
      - name: Install Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/plugin-tests" playwright@1.62.1
          "$RUNNER_TEMP/plugin-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Install Creator sandbox backend
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Verify native and WebUI module lifecycle
        env:
          CODEX_ARTIFACT_DIR: ${{ runner.temp }}/plugin-browser
        run: NODE_PATH="$RUNNER_TEMP/plugin-tests/node_modules" node tests/plugin_browser_test.cjs build/codex-cpp build/plugin-demo/plugin.json
      - name: Verify Agent plugin Creator workflow
        env:
          CODEX_ARTIFACT_DIR: ${{ runner.temp }}/plugin-browser
        run: NODE_PATH="$RUNNER_TEMP/plugin-tests/node_modules" node tests/plugin_creator_browser_test.cjs build/codex-cpp
      - name: Verify large-session incremental snapshots in Chromium
        run: NODE_PATH="$RUNNER_TEMP/plugin-tests/node_modules" node tests/long_session_test.cjs build/codex-cpp --browser
      - name: Verify MiniWeb pixels, image history and Chromium geometry
        run: NODE_PATH="$RUNNER_TEMP/plugin-tests/node_modules" node tests/miniweb_test.cjs build/codex-cpp build/miniweb/miniweb-regression --browser
      - name: Verify tool history across repeated context compaction
        env:
          CODEX_ARTIFACT_DIR: ${{ runner.temp }}/plugin-browser
        run: NODE_PATH="$RUNNER_TEMP/plugin-tests/node_modules" node tests/compaction_history_test.cjs build/codex-cpp --browser
      - name: Verify actionable model failures and persistent diagnostics
        run: NODE_PATH="$RUNNER_TEMP/plugin-tests/node_modules" node tests/agent_failure_test.cjs build/codex-cpp --browser
      - name: Verify side discussion, settings and idle suggestions in Chromium
        env:
          CODEX_ARTIFACT_DIR: ${{ runner.temp }}/plugin-browser
        run: NODE_PATH="$RUNNER_TEMP/plugin-tests/node_modules" node tests/side_chat_test.cjs build/codex-cpp --browser
      - name: Verify early tool progress and Markdown rendering in Chromium
        env:
          CODEX_ARTIFACT_DIR: ${{ runner.temp }}/plugin-browser
        run: |
          NODE_PATH="$RUNNER_TEMP/plugin-tests/node_modules" node tests/model_activity_test.cjs build/codex-cpp build/codex-self-test --browser
          NODE_PATH="$RUNNER_TEMP/plugin-tests/node_modules" node tests/markdown_test.cjs
          NODE_PATH="$RUNNER_TEMP/plugin-tests/node_modules" node tests/math_test.cjs build/codex-cpp
      - name: Verify settings categories and TUI synchronization
        env:
          CODEX_ARTIFACT_DIR: ${{ runner.temp }}/plugin-browser
        run: NODE_PATH="$RUNNER_TEMP/plugin-tests/node_modules" node tests/settings_test.cjs build/codex-cpp --browser --tui
      - name: Verify portable WebUI bridge in Chromium
        run: NODE_PATH="$RUNNER_TEMP/plugin-tests/node_modules" node tests/portable_web_test.cjs build/codex-cpp
      - name: Verify manual-trust startup also freezes worker resources
        env:
          CODEX_ARTIFACT_DIR: ${{ runner.temp }}/plugin-browser-legacy
          CREATOR_TEST_LEGACY: 1
        run: NODE_PATH="$RUNNER_TEMP/plugin-tests/node_modules" node tests/plugin_creator_browser_test.cjs build/codex-cpp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-browser
          path: ${{ runner.temp }}/plugin-browser
          if-no-files-found: ignore
