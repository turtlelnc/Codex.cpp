name: CI Build
on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build 32-bit x86 in Alpine container
        run: |
          docker run --rm --platform linux/386 -v "$PWD:/work" -w /work i386/alpine:latest sh -c "
            apk update && apk add --no-cache g++ cmake make openssl-dev &&
            cmake -B build -DCMAKE_BUILD_TYPE=Release &&
            cmake --build build --parallel 2
          "
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: codex-cpp-linux-x86
          path: build/codex-cpp
