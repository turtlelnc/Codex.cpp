name: CI Build
on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build 32-bit x86 in Alpine container
        run: |
          docker run --rm --platform linux/386 -v "$PWD:/work" -w /work i386/alpine:latest sh -c '
            set -e
            apk update && apk add --no-cache g++ cmake make openssl-dev pkgconfig linux-headers python3
            if ! grep -q "<cstdint>" miniweb/src/image.h; then
              sed -i "1i #include <cstdint>" miniweb/src/image.h
            fi
            python3 - << "PYEOF"
p = "codex_update.inc"
s = open(p, encoding="utf-8").read()
target = "std::string updater::asset()"
idx = s.find(target)
if idx != -1:
    ret_idx = s.find("return base;", idx)
    if ret_idx != -1:
        block = s[idx:ret_idx]
        if "base" not in block.replace("return base;", ""):
            s = s[:ret_idx] + "std::string base = \"codex-cpp-linux-x86\";\n  " + s[ret_idx:]
            open(p, "w", encoding="utf-8").write(s)
PYEOF
            CRYPTO_LIB=$(find /usr/lib /lib -name "libcrypto.so*" -o -name "libcrypto.a" 2>/dev/null | head -n 1)
            SSL_LIB=$(find /usr/lib /lib -name "libssl.so*" -o -name "libssl.a" 2>/dev/null | head -n 1)
            cmake -B build -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_FLAGS="-w" \
              -DCMAKE_CXX_FLAGS="-w" \
              -DOPENSSL_ROOT_DIR=/usr \
              -DOPENSSL_INCLUDE_DIR=/usr/include \
              -DOPENSSL_CRYPTO_LIBRARY="$CRYPTO_LIB" \
              -DOPENSSL_SSL_LIBRARY="$SSL_LIB"
            if ! cmake --build build --parallel 1 > build.log 2>&1; then
              grep -n -C 5 -i "error:" build.log || tail -n 60 build.log
              exit 1
            fi
            ls -la build
          '
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: codex-cpp-linux-x86
          path: build/codex-cpp*
          if-no-files-found: error
