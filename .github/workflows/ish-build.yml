name: ish-Build
on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    container: i386/alpine:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install tools
        run: apk update && apk add --no-cache g++ cmake make openssl-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: codex-cpp-linux-x86
          path: build/codex-cpp
