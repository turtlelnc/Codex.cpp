name: Publish verified release artifacts
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Single-file release run ID
        required: true
      expected_sha:
        description: Exact verified source commit
        required: true
      tag:
        description: New preview tag ending in source short SHA
        required: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN: ${{ inputs.build_run }}
      SOURCE_SHA: ${{ inputs.expected_sha }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify artifact provenance before downloading
        run: |
          node <<'JS'
          const assert=require('node:assert/strict'),cp=require('node:child_process'),e=process.env;
          assert(/^\d+$/.test(e.BUILD_RUN));assert(/^[a-f0-9]{40}$/.test(e.SOURCE_SHA));assert(/^plugin-preview-\d{8}-[a-f0-9]{7}$/.test(e.RELEASE_TAG));assert(e.RELEASE_TAG.endsWith(e.SOURCE_SHA.slice(0,7)));
          const run=JSON.parse(cp.execFileSync('gh',['api',`repos/${e.GITHUB_REPOSITORY}/actions/runs/${e.BUILD_RUN}`],{encoding:'utf8'}));
          assert.equal(run.conclusion,'success');assert.equal(run.head_sha,e.SOURCE_SHA);assert.equal(run.head_repository.full_name,e.GITHUB_REPOSITORY);assert.equal(run.path,'.github/workflows/release.yml');
          JS
      - name: Download and package verified binaries
        run: |
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --dir raw
          node scripts/prepare-verified-release.cjs raw dist
          (cd dist && sha256sum --check SHA256SUMS.txt && sha256sum --check DOWNLOADS_SHA256SUMS.txt)
      - name: Publish preview without merging main
        run: |
          node <<'JS'
          const fs=require('node:fs'),e=process.env;
          fs.writeFileSync('preview-notes.md',`Verified source: ${e.SOURCE_SHA}\n\nAll-platform build: https://github.com/${e.GITHUB_REPOSITORY}/actions/runs/${e.BUILD_RUN}\n\nMain is not merged automatically. This is a preview. macOS users should download .zip; Linux users should download .tar.gz to preserve executable permissions. Linux -native variants support native Plugins (glibc >=2.35 x64, >=2.39 ARM64); static-musl variants do not dlopen.\n\n`+fs.readFileSync('docs/RELEASE_NOTES.md','utf8'));
          JS
          cd dist
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --prerelease --latest=false --title "Plugin Creator all-platform preview" --notes-file ../preview-notes.md codex-cpp-* SHA256SUMS.txt DOWNLOADS_SHA256SUMS.txt
      - name: Verify published assets
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > published.json
          node <<'JS'
          const fs=require('node:fs'),crypto=require('node:crypto'),assert=require('node:assert/strict'),r=JSON.parse(fs.readFileSync('published.json','utf8'));
          assert.equal(r.target_commitish,process.env.SOURCE_SHA);assert.equal(r.prerelease,true);assert.equal(r.draft,false);assert.equal(r.assets.length,17);
          for(const a of r.assets){const bytes=fs.readFileSync('dist/'+a.name);assert.equal(a.size,bytes.length);assert.equal(a.digest,'sha256:'+crypto.createHash('sha256').update(bytes).digest('hex'));}
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`Published and verified all 17 assets: ${r.html_url}\n`);
          JS
